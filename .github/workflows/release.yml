name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v6

      # Check version（越早失败越省时间）
      - name: Check version
        run: node ./scripts/check_version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # Install Node.js
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      # Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Build for production
      - name: Build for production
        run: pnpm build

      # Package as zip file
      - name: Zip it
        run: zip -r dist.zip dist/

      # Get changelog
      - name: Get CHANGELOGS
        run: node ./scripts/release_note.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ./result.txt
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist.zip

      - name: publish on npm
        if: ${{ ! (contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev')) }}
        run: npm stage publish --provenance