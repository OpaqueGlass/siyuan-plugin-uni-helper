name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v6

      # Check version（越早失败越省时间）
      - name: Check version
        run: node ./scripts/check_version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # 自带 npm 版本不满足 npm stage publish，显式安装指定版本
      - name: Install npm
        run: |
          npm install -g npm@11.15.0
          NPM_BIN="$(npm prefix -g)/bin"
          echo "$NPM_BIN" >> "$GITHUB_PATH"
          "$NPM_BIN/npm" -v

      - name: Verify npm stage
        run: |
          command -v npm
          npm -v

      # Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Build for production
      - name: Build for production
        run: pnpm build

      # Package as zip file
      - name: Zip it
        run: zip -r dist.zip dist/

      # Get changelog
      - name: Get CHANGELOGS
        run: node ./scripts/release_note.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ./result.txt
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist.zip

      - name: publish on npm
        if: ${{ ! (contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev')) }}
        run: npm stage publish --provenance